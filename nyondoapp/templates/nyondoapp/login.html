{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NyondoStock Login</title>
    <!-- links bootstrap CSS and the custom stylesheet -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'login.css' %}" />
  </head>
  <!-- centres the card vertically and horizontally on the screen the flex part-->
  <body
    class="bg-light d-flex justify-content-center align-items-center vh-100"
  >
    <!-- the login card container -->
    <div class="card p-4 shadow" style="max-width: 400px; width: 100%">
      <div class="text-center">
        <!-- company logo -->
        <img
          src="{% static 'images/logo-edit.png' %}"
          alt="NyondoStock Logo"
          width="100"
          class="logo"
        />
      </div>
      <h2 class="text-center">NyondoStock</h2>
      <h6 class="text-center">NYONDO General Hardware LTD</h6>
      <!-- content on the login form the username, password, role and submit button -->
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        {% if messages %}
          {% for message in messages %}
            {% if 'error' in message.tags %}
            <div class="alert alert-danger mt-2">{{ message }}</div>
            {% endif %}
          {% endfor %}
        {% endif %}
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Enter Your Username"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter your Password"
            required
          />
        </div>
        <button type="submit" class="btn btn-success w-100">Login</button>
        <p class="text-center mt-3 mb-1">Forgot password? Contact admin</p>
        <p class="text-center">No account? Contact your administrator.</p>
      </form>
    </div>
    <!-- Bootstrap JS bundle for interactive components -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
